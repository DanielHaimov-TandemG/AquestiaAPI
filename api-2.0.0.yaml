  /devices/{device_id}/notifications/signalr:
    post:
      operationId: post_devices_deviceId_notifications_signalr
      summary: Subscribe to device notifications
      tags:
        - Notifications
      description: |
        Subscribe the authenticated user to receive real-time notifications for a specific device via SignalR. This enables instant alerts for device state changes, measurement thresholds, rule violations, and other important events.
        
        **Notification Types:**
        - **Device Status Changes**: Connection, disconnection, and operational state alerts
        - **Measurement Alerts**: Threshold violations and anomaly detections from device sensors
        - **Rule Violations**: Automated rule engine alerts based on configured conditions
        - **System Events**: Firmware updates, configuration changes, and maintenance notifications
        
        **Real-time Delivery:** Uses SignalR for low-latency, persistent connection notifications that work across web browsers and mobile applications.
        
        **Access Control:** User must have read access to the device and its associated managed groups to subscribe to notifications.
      parameters:
        - name: device_id
          in: path
          description: Unique identifier of the device to subscribe to for notifications
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        "200":
          description: Successfully subscribed to device notifications via SignalR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: Invalid device ID or user already subscribed to this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "403":
          description: Insufficient permissions to access notifications for this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "404":
          description: Device not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred while setting up notification subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    delete:
      operationId: delete_devices_deviceId_notifications_signalr
      summary: Unsubscribe from device notifications  
      tags:
        - Notifications
      description: |
        Unsubscribe the authenticated user from receiving real-time notifications for a specific device. This stops all SignalR notifications for the device while preserving subscriptions to other devices.
        
        **Effect:** 
        - Removes user from the device's notification group
        - Stops all real-time alerts for this device
        - Does not affect email notifications or notifications for other devices
        - User can re-subscribe at any time if they have appropriate permissions
        
        **Use Cases:**
        - Temporary reduction of notification volume
        - Role changes where device monitoring is no longer required
        - Device decommissioning or transfer to different teams
      parameters:
        - name: device_id
          in: path
          description: Unique identifier of the device to unsubscribe from notifications
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        "200":
          description: Successfully unsubscribed from device notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: Invalid device ID or user not currently subscribed to this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "404":
          description: Device not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred while removing notification subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
