  /rules:
    get:
      operationId: get_rules
      summary: Retrieve rules for devices and groups
      tags:
        - Rules
      description: |
        Retrieve a list of rules configured for monitoring and responding to device measurements and events. Rules define automated responses to specific conditions and can trigger notifications, device actions, or other system behaviors.
        
        **Rule System Features:**
        - **Time-based Logic**: Rules can use 24-hour rolling averages and complex temporal conditions
        - **Threshold Monitoring**: Set limits on device measurements with configurable thresholds
        - **Device State Changes**: Respond to device connectivity, battery levels, or operational status changes
        - **Multi-condition Logic**: Combine multiple criteria with AND/OR logic
        - **Action Triggers**: Execute automated responses when conditions are met
        
        **Filtering**: Use the optional groupId parameter to retrieve rules for specific managed groups and their devices.
        
        **Access Control**: Returns only rules for devices and groups the authenticated user has access to view.
      parameters:
        - $ref: "#/components/parameters/groupIdUnrequiredInQuery"
      responses:
        "200":
          description: Successfully retrieved rules list with their configurations and current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRulesResponse"
        "400":
          description: Invalid query parameters or malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred while retrieving rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    post:
      operationId: post_rules
      summary: Create a new monitoring rule
      tags:
        - Rules
      description: |
        Create a new rule to monitor device measurements, states, or events and trigger automated responses. Rules are the core automation engine of the TandemG platform.
        
        **Rule Configuration:**
        - **Trigger Conditions**: Define what device measurements or states to monitor
        - **Time-based Logic**: Use 24-hour rolling averages, time windows, or instant thresholds
        - **Action Definitions**: Specify what happens when the rule triggers (notifications, device commands, etc.)
        - **Notification Targets**: Configure which notification groups receive alerts
        - **Severity Levels**: Set priority levels for rule violations
        
        **Rule Types:**
        - **Measurement Rules**: Monitor sensor readings against thresholds
        - **Status Rules**: Track device connectivity and operational states
        - **Event Rules**: Respond to specific device events or state changes
        - **Composite Rules**: Combine multiple conditions across different devices
        
        **Access Control**: Rules are automatically scoped to the managed groups the creating user has access to.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRequestPost"
        required: true
      responses:
        "200":
          description: Rule successfully created and activated for monitoring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddRuleResponse"
        "400":
          description: Invalid rule configuration, missing required fields, or conflicting conditions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred during rule creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
