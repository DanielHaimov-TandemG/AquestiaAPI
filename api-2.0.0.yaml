        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    post:
      operationId: post_devices_deviceId
      summary: Add a new gateway or end device
      tags:
        - Devices
      description: |
        Add a new IoT device (gateway or end device) as a child of an existing gateway device. This endpoint is used for creating device hierarchies where gateways manage multiple end devices.
        
        **Device Hierarchy:**
        - **Gateway devices** can have multiple child devices (end devices or other gateways)
        - **End devices** typically connect through a gateway but can also connect directly
        - Device relationships determine data routing and management responsibilities
        
        **Device Configuration:**
        - Device model determines available measurements and capabilities
        - Initial configuration includes connection parameters and operational settings
        - Device is automatically assigned to appropriate managed groups based on parent device permissions
        
        **Access Control:** Requires write access to the parent device and its associated managed groups.
      parameters:
        - name: device_id
          in: path
          description: Unique identifier of the parent gateway device that will manage the new device
          required: true
          style: simple
          explode: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDeviceBody"
        required: true
      responses:
        "200":
          description: Device successfully added and configured under the specified gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: Invalid device configuration, missing required fields, or incompatible device model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "403":
          description: Insufficient permissions to add devices under the specified gateway
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "404":
          description: Parent gateway device not found or not accessible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred during device creation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    delete:
      operationId: delete_devices_deviceId
      tags:
        - Devices
      description: Delete device.
      parameters:
        - name: device_id
          in: path
          description: id of device
          required: true
          style: simple
          explode: false
          schema:
