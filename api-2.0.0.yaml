          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            enum:
              - ascending
              - descending
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationGroupsResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    post:
      operationId: post_notificationGroups
      tags:
        - NotificationGroup
      description: add device-group notification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BaseNotificationGroup"
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
  /notificationGroups/{notificationId}:
    get:
      operationId: get_notificationGroups_notificationId
      tags:
        - NotificationGroup
      description: get device-group notification by notification id
      parameters:
        - $ref: "#/components/parameters/notificationId"
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationGroupResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    put:
      operationId: put_notificationGroups_notificationId
      tags:
        - NotificationGroup
      description: update device-group notification
      parameters:
        - $ref: "#/components/parameters/notificationId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationGroup"
        required: true
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    delete:
      operationId: delete_notificationGroups_notificationId
      tags:
        - NotificationGroup
      description: delete device-group notification
      parameters:
        - $ref: "#/components/parameters/notificationId"
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccessResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
components:
  schemas:
    NetworkInfo:
      type: object
      properties:
        network:
          type: string
        ipv4:
          type: string
        iccid:
          type: string
        imei:
          type: string
        rssi:
          type: integer
        rsrp:
          type: integer
        rsrq:
          type: integer
        sinr:
          type: integer
    DeviceStatus:
      type: object
      properties:
        alerts:
          type: array
          items:
            type: string
        networkInfo:
          $ref: "#/components/schemas/NetworkInfo"
        batteryLevel:
          type: number
        additionalData:
          type: object
          additionalProperties: true # Matches JObject's flexible structure
    GetRuleResponseData:
      allOf:
        - $ref: "#/components/schemas/RuleRequestPut"
        - type: object
          properties:
            lastProcessingTime:
              type: string
              format: date-time
    RuleRequestPut:
      allOf:
        - $ref: "#/components/schemas/RuleRequestPost"
        - required:
            - type
          type: object
          properties:
            id:
              type: string
    RuleRequestPost:
      type: object
      properties:
        friendlyName:
          type: string
        deviceGroupId:
          type: string
        timeOfDayToProcess:
          type: string
          format: date-time
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        notificationIds:
          type: array
          items:
            type: string
    SystemPreferences:
      type: object
      additionalProperties: true
    GenericFilterField:
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          type: string
          description: field name according to model
        operation:
          type: string
          description: filter operation to perform on field
          enum:
            - equal
            - contains
            - biggerThan
            - biggerOrEqualThan
            - smallerThan
            - smallerOrEqualThan
        value:
          description: value to use for the filter operation
          oneOf:
            - type: string
            - type: number
    roleWithId:
      allOf:
        - $ref: "#/components/schemas/role"
        - required:
            - id
          type: object
          properties:
            id:
              type: string
    role:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/permission"
    getGroupsFilter:
      type: object
      properties:
        groupTypes:
          type: array
          items:
            type: string
    groupModelWithId:
      required:
        - groupType
        - id
        - model
      type: object
      properties:
        id:
          type: string
        groupType:
          type: string
          description: unique group type id
        model:
          $ref: "#/components/schemas/groupModelSpec"
    groupModel:
      required:
        - groupType
        - id
      type: object
      properties:
        id:
          type: string
        groupType:
          type: string
          description: unique group type id
    groupModelSpec:
      type: object
      properties:
        directSubGroupModelIds:
          type: array
          items:
            type: string
        isDevicesAllowedDirectly:
          type: boolean
        info:
          $ref: "#/components/schemas/jsonSchema"
    addGroupModel:
      required:
        - groupType
        - model
      type: object
      properties:
        groupType:
          type: string
          description: unique group type id
        model:
          $ref: "#/components/schemas/groupModelSpec"
    deviceModelWithId:
      required:
        - deviceType
        - id
        - model
      type: object
      properties:
        id:
          type: string
        deviceType:
          type: string
          description: unique device type id
        minVersion:
          type: string
          description: >-
            optional minimum version of model (model of this type must not be
            already present)
          format: version
        maxVersion:
          type: string
          description: >-
            optional maximum version of model (model of this type must not have
            this version range)
          format: version
        model:
          $ref: "#/components/schemas/deviceModelSpec"
    deviceModel:
      required:
        - deviceType
        - model
      type: object
      properties:
        deviceType:
          type: string
          description: unique device type id
        minVersion:
          type: string
          description: >-
            optional minimum version of model (model of this type must not be
            already present)
          format: version
        maxVersion:
          type: string
          description: >-
            optional maximum version of model (model of this type must not have
            this version range)
          format: version
        model:
          $ref: "#/components/schemas/deviceModelSpec"
    deviceModelSpec:
      type: object
      properties:
        supportedMethods:
          type: array
          items:
            $ref: "#/components/schemas/deviceModelSpec_supportedMethods"
        statusAdditionalData:
          $ref: "#/components/schemas/jsonSchema"
        metadata:
          $ref: "#/components/schemas/jsonSchema"
        info:
          $ref: "#/components/schemas/jsonSchema"
        configurations:
          $ref: "#/components/schemas/jsonSchema"
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/deviceModelSpec_measurements"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/deviceModelSpec_alerts"
        statusAlertConditions:
          type: array
          items:
            $ref: "#/components/schemas/statusAlertCondition"
    statusAlertCondition:
      type: object
      required:
        - alertId
      properties:
        alertId:
          type: string
        condition:
          $ref: "#/components/schemas/statusAlertConditionOperation"
        statusAssertions:
          type: array
          items:
            $ref: "#/components/schemas/statusAssertion"
    statusAssertion:
      required:
        - field
        - operation
        - value
      type: object
      properties:
        field:
          type: string
          description: json path for field
        operation:
          type: string
          enum:
            - equal
            - notEqual
            - contains
            - biggerThan
            - biggerOrEqualThan
            - smallerOrEqualThan
            - oneOf
        value:
          oneOf:
            - type: string
            - type: number
            - type: integer
    statusAlertConditionOperation:
      type: string
      enum:
        - and
        - or
    jsonSchema:
      type: object
      format: json-schema
    permission:
      type: string
      enum:
        - ReadFwVersions
        - ReadManagedDevices
        - ReadDevices
        - ReadWriteManagedDevices
        - ReadWriteDevices
        - ReadUpdateManagedDevices
        - ReadUpdateDevices
        - ReadWriteFwVersions
        - ReadWriteUsers
        - ReadUsers
        - ReadWriteManagedUsers
        - ReadManagedUsers
        - ReadWriteDeviceGroups
        - ReadWriteManagedDeviceGroups
        - ReadManagedDeviceGroups
        - ReadWriteRules
        - ReadWriteManagedRules
        - ReadManagedRules
        - ProvisionDevices
        - ReadWriteUserGroups
        - ReadWriteManagedNotifications
        - ReadRoles
        - ReadWriteRoles
        - ReadWriteDeviceModels
        - ReadWriteDeviceGroupModels
        - ReadRuleHistory
        - ReadDeviceLogs
    DeviceStringFilter:
      required:
        - operation
        - value
      type: object
      properties:
        operation:
          type: string
          enum:
            - equal
            - contains
            - oneOf
        value:
          description: value to use for filter
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    DeviceDateFilter:
      type: object
      properties:
        minimum:
          type: string
          format: date-time
        maximum:
          type: string
          format: date-time
    DeviceQueryCountBody:
      type: object
      properties:
        locationReference:
          $ref: "#/components/schemas/DeviceQueryCountBody_locationReference"
        filters:
          type: array
          description: array of filters in the same order as they appear in response
          items:
            $ref: "#/components/schemas/deviceFilter"
    Analysis:
      type: string
      enum:
        - raw
        - aggregation
    DeviceQueryListBody:
      type: object
      properties:
        offset:
          type: number
        limit:
          type: number
          nullable: true
        locationReference:
          $ref: "#/components/schemas/DeviceQueryCountBody_locationReference"
        filters:
          $ref: "#/components/schemas/deviceFilter"
        orderBy:
          type: array
          items:
            $ref: "#/components/schemas/DeviceQueryListBody_orderBy"
        fields:
          type: array
          items:
            type: string
            enum:
              - deviceId
              - name
              - type
              - gatewayId
              - managedGroup
    deviceFilter:
      type: object
      properties:
        managedGroup:
          $ref: "#/components/schemas/DeviceStringFilter"
        gateway:
          $ref: "#/components/schemas/DeviceStringFilter"
        deviceId:
          $ref: "#/components/schemas/DeviceStringFilter"
        deviceName:
          $ref: "#/components/schemas/DeviceStringFilter"
        deviceNameOrId:
          $ref: "#/components/schemas/DeviceStringFilter"
        creationDate:
          $ref: "#/components/schemas/DeviceDateFilter"
        deviceType:
          $ref: "#/components/schemas/DeviceStringFilter"
        connectionState:
          type: string
          description: online / offline controllers
          enum:
            - online
            - offline
        hasAlerts:
          type: boolean
          description: alerted/not alerted devices
        lastSeen:
          $ref: "#/components/schemas/DeviceDateFilter"
        alerts:
          type: array
          description: list of alerts that device contains
          items:
            type: string
        distance:
          $ref: "#/components/schemas/deviceFilter_distance"
        pendingVersion:
          type: string
          format: xx.xx.xxxx
        currentVersion:
          type: string
          format: xx.xx.xxxx
        statusUpdated:
          $ref: "#/components/schemas/DeviceDateFilter"
        status:
          type: array
          description: status filters
          items:
            $ref: "#/components/schemas/GenericFilterField"
        metadata:
          type: array
          description: metadata filters
          items:
            $ref: "#/components/schemas/GenericFilterField"
    AlertQueryBody:
      type: object
      properties:
        locationReference:
          $ref: "#/components/schemas/DeviceQueryCountBody_locationReference"
        filters:
          $ref: "#/components/schemas/AlertQueryBody_filters"
    GetDevicesResponse:
      required:
        - data
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/GetDevicesResponse_data"
    GetConfigurationsResponse:
      required:
        - data
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/GetConfigurationsData"
    PutDeviceBody:
      oneOf:
        - type: object
    GetDeviceResponse:
      required:
        - data
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/DeviceOutput"
    SoftwareVersionResponse:
      required:
        - data
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/SoftwareVersionResponse_data"
    GenericSuccessResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          type: object
    GenericFailureResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusFail"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          type: object
    NewDeviceBody:
      allOf:
        - $ref: "#/components/schemas/UpdateDeviceBody"
        - required:
            - type
          type: object
          properties:
            gateway:
              $ref: "#/components/schemas/UpdateDeviceBody_gateway"
            type:
              type: string
              description: device type
    UpdateDeviceBody:
      type: object
      properties:
        managedGroup:
          type: string
          description: groupID
        configurations:
          type: object
          description: configs based on device schema
        metadata:
          type: object
          description: metadata based on device schema
        location:
          $ref: "#/components/schemas/UpdateDeviceBody_location"
        name:
          type: string
        statusAlertConditions:
          type: array
          items:
            $ref: "#/components/schemas/statusAlertCondition"
      description: >-
        all properties are optional. If set, will be updated, if not will be
        dismissed.
    PutDeviceImageResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/ImageData"
    GetLatestVersionResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/VersionDetailsResponse"
    GetDeviceActiveAlertsResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeviceActiveAlerts"
    PostVersionResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/PostVersionResponse_data"
    GetVersionsResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          type: array
          items:
            $ref: "#/components/schemas/VersionInfo"
    GetUsersResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/GetUsersResponse_data"
    DeviceActionResponse:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/DeviceActionResponse_data"
    GetUserRegistrationResponse:
      required:
        - data
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/GetUserRegistrationResponse_data"
    PostRegistrationVerificationBody:
      type: object
      properties:
        verificationCode:
          type: string
          description: verification code
    PostResetPasswordStage3Body:
      type: object
      properties:
        newPassword:
          type: string
    GetCurrentUserInfoResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/CurrentUserInfo"
    GetUserInfoResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/UserInfo"
    PostSupportBody:
      required:
        - email
        - issue
        - name
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        issue:
          type: string
    GetStaticContentResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/ListResponse"
    PostResetPasswordResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/ForgotPasswordResponse"
    GetResetPasswordResponse:
      required:
        - data
        - status
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ResponseStatusSuccess"
        errors:
          $ref: "#/components/schemas/ResponseErrors"
        data:
          $ref: "#/components/schemas/GetUserRegistrationResponse_data"
    DeviceOutput:
      required:
        - creationDate
        - deviceId
        - type
      type: object
      properties:
        deviceId:
          type: string
        name:
          type: string
        gatewayId:
          type: string
        type:
          type: string
        creationDate:
          type: string
          format: date-time
        fwVersion:
          $ref: "#/components/schemas/DeviceOutput_fwVersion"
        managedGroup:
          $ref: "#/components/schemas/DeviceOutput_managedGroup"
        location:
          $ref: "#/components/schemas/DeviceOutput_location"
        distance:
          type: number
          description: >-
            if specified reference location, this will be the distance from it
            in meters
        gatewayConnectionState:
          type: string
          enum:
            - online
            - offline
        gatewayLastSeen:
          type: string
          format: date-time
        statusUpdateTime:
          type: string
          format: date-time
        metadata:
          type: object
          description: data received from user about device
        gatewayMetadata:
          type: object
          description: data received from GW about device
        status:
          $ref: "#/components/schemas/DeviceStatus"
        statusAlertConditions:
          type: array
          items:
            $ref: "#/components/schemas/statusAlertCondition"
        image:
          $ref: "#/components/schemas/ImageData"
        lastMeasurements:
          type: array
          items:
            $ref: "#/components/schemas/DeviceMeasurement"
    DeviceMeasurement:
      type: object
      properties:
        name:
          type: string
        ts:
          type: string
          format: date-time
        friendlyName:
          type: string
        value:
          type: object
        valueUnit:
          type: string
      required:
        - name
        - ts
        - value
    Pagination:
      required:
        - offset
        - totalCount
      type: object
      properties:
        offset:
          type: integer
        count:
          type: integer
        totalCount:
          type: integer
    ResponseStatusSuccess:
      type: object
      properties:
        result:
          type: string
          enum:
            - success
        code:
          type: integer
    ResponseStatusFail:
      type: object
      properties:
        result:
          type: string
          enum:
            - fail
        code:
          type: integer
    ResponseErrors:
      type: array
      items:
        $ref: "#/components/schemas/ResponseErrors_inner"
    AlertType:
      type: string
      description: restricted to staticcontent/alerttypes options
    DeviceActiveAlerts:
      required:
        - alert
        - deviceId
        - deviceType
      type: object
      properties:
        deviceId:
          type: string
        deviceType:
          type: string
        alert:
          $ref: "#/components/schemas/DeviceActiveAlerts_alert"
    AdminRegistrationInfo:
      allOf:
        - $ref: "#/components/schemas/UserBaseInfo"
        - required:
            - email
          type: object
          properties:
            managedGroups:
              type: array
              items:
                type: string
    UserBaseInfo:
      type: object
      required:
        - roleId
      properties:
        email:
          type: string
        mobilePhone:
          type: string
        additionalPhone:
          type: string
        country:
          type: string
        timeZone:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        roleId:
          type: string
          description: must be one of system's existing roles
        shouldReceiveUpdates:
          type: boolean
        suppressInviteEmail:
          type: boolean
    UserInfo:
      allOf:
        - $ref: "#/components/schemas/UserBaseInfo"
        - required:
            - email
          type: object
          properties:
            dateOfCreation:
              type: string
              format: date-time
            managedGroups:
              type: array
              items:
                $ref: "#/components/schemas/DeviceOutput_managedGroup"
    CurrentUserInfo:
      allOf:
        - $ref: "#/components/schemas/UserInfo"
        - type: object
          properties:
            role:
              $ref: "#/components/schemas/role"
    ForgotPasswordResponse:
      required:
        - sessionId
      type: object
      properties:
        sessionId:
          type: string
    UserUpdateInfo:
      allOf:
        - $ref: "#/components/schemas/UserBaseInfo"
        - type: object
          properties:
            managedGroups:
              type: array
              items:
                type: string
    ResponseStatus:
      type: object
      properties:
        result:
          type: string
          enum:
            - fail
            - success
        code:
          type: integer
    ListResponse:
      type: array
      items:
        $ref: "#/components/schemas/ListResponse_inner"
    BaseNotificationGroup:
      type: object
      properties:
        enabled:
          type: boolean
        deviceGroupId:
          type: string
        deviceAlerts:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDeviceAlerts"
        notificationName:
          type: string
