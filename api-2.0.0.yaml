openapi: 3.0.0
info:
  title: TandemG IoT Platform API
  description: |
    **TandemG IoT Platform API** - A comprehensive IoT management platform that enables organizations to connect, monitor, and manage IoT devices at scale.
    
    ## Overview
    This API provides complete lifecycle management for IoT devices including:
    - **Device Management**: Registration, configuration, and lifecycle management of IoT devices and gateways
    - **Hierarchical Organization**: Flexible device grouping with hierarchical managed groups for organizational structure
    - **Real-time Monitoring**: Live device status, measurements, and alert management
    - **Automated Rules Engine**: Complex rule-based automation with time-based conditions and cross-device comparisons
    - **User & Permission Management**: Role-based access control with OIDC authentication
    - **Historical Analytics**: Comprehensive data history and analytics for measurements, events, and device status
    - **Firmware Management**: Version control and over-the-air updates for devices
    - **Notification System**: Multi-channel alerts via email, SMS, mobile push, and real-time notifications
    
    ## Key Concepts
    - **Devices**: Individual IoT endpoints that send data and can receive commands
    - **Gateways**: Devices that act as intermediaries for other devices
    - **Managed Groups**: Hierarchical organizational structure for devices (groups can contain subgroups and devices)
    - **Measurements**: Configurable data points defined per deployment using device models
    - **Rules**: Automated conditions that trigger alerts or device actions based on measurement thresholds or cross-device comparisons
    - **Notification Groups**: Mailing list-style groups for distributing alerts and notifications
    
    ## Authentication
    This API uses OIDC (OpenID Connect) for authentication. All endpoints require valid authentication unless otherwise specified.
    
    ## Server Configuration
    The base URL should be configured according to your deployment environment. The localhost URL below is for development purposes only.
  version: 2.0.0
  contact:
    name: TandemG
    email: info@tandemg.com
  license:
    name: Commercial
servers:
  - url: http://localhost:5000/api
    description: Local development server (configure for your environment)
tags:
  - name: Devices
    description: |
      Core IoT device management including registration, configuration, lifecycle management, and device hierarchy operations.
      Handles both end devices and gateways with their associated data, status monitoring, and control capabilities.
  - name: Devices Actions
    description: |
      Execute commands and actions on IoT devices including remote operations, configuration updates, and device control.
      Supports both immediate and scheduled actions with configurable timeouts.
  - name: Device Versions
    description: |
      Manage device firmware versions, over-the-air updates, and version tracking.
      Handles version deployment, rollback capabilities, and update status monitoring.
  - name: Gateway Versions
    description: |
      Specialized firmware management for gateway devices including gateway-specific updates and version control.
      Manages gateway firmware distribution and compatibility with connected end devices.
  - name: Device Images
    description: |
      Handle device firmware images and software packages for individual devices.
      Supports image upload, validation, and deployment to specific devices.
  - name: Device Group Images
    description: |
      Manage firmware images at the device group level for bulk deployment operations.
      Enables coordinated updates across multiple devices within managed groups.
  - name: Users
    description: |
      User account management including authentication, authorization, profile management, and role-based access control.
      Handles user registration, permissions, and managed group assignments.
  - name: UserGroups
    description: |
      Manage user groups for organizing users and controlling access to resources.
      Supports hierarchical user organization and group-based permission management.
  - name: Groups
    description: |
      Managed groups for organizing devices in hierarchical structures.
      Groups can contain subgroups and devices, providing organizational boundaries for access control and operations.
  - name: Rules
    description: |
      Automated monitoring and response system for device measurements and events.
      Supports complex time-based logic, threshold monitoring, multi-condition rules, and automated actions including notifications.
  - name: Notifications
    description: |
      Real-time notification system supporting multiple delivery channels including SignalR, email, SMS, and mobile push notifications.
      Handles notification subscriptions, device-specific alerts, and user notification preferences.
  - name: NotificationGroup
    description: |
      Notification groups that function like mailing lists for distributing alerts and system notifications.
      Manages group membership, notification routing, and alert distribution policies.
  - name: Statistics
    description: |
      System analytics and metrics including device statistics, usage patterns, and platform performance data.
      Provides aggregated data for monitoring platform health and device activity.
  - name: Software Version
    description: |
      Platform software version information and compatibility details.
      Tracks API versions, feature compatibility, and system update information.
  - name: Device Models
    description: |
      Device model definitions and specifications including device capabilities, supported measurements, and configuration schemas.
      Manages device types, model-specific attributes, and device classification.
  - name: DeviceSwLogs
    description: |
      Device software logs and diagnostic information for troubleshooting and monitoring device behavior.
      Provides access to device-generated logs and system diagnostic data.
  - name: Events History
    description: |
      Historical event data and analytics for devices including event patterns, trend analysis, and audit trails.
      Enables investigation of device behavior over time and event correlation.
  - name: Gateways
    description: |
      Gateway device management including gateway-specific operations, child device management, and network topology.
      Handles gateway configuration, connectivity, and relationship management with end devices.
  - name: Group Models
    description: |
      Device group model definitions and templates for organizing and managing collections of devices.
      Provides standardized group configurations and group-level policies.
  - name: Measurements History
    description: |
      Historical measurement data from device sensors including time-series data, aggregations, and trend analysis.
      Supports querying measurement history with various time intervals and filtering options.
  - name: Provisioning
    description: |
      Device provisioning and onboarding processes including device registration, initial configuration, and activation.
      Manages device lifecycle from initial setup through operational deployment.
  - name: Roles
    description: |
      Role-based access control system including role definitions, permission management, and user role assignments.
      Defines what actions users can perform based on their assigned roles and managed groups.
  - name: RuleHistory
    description: |
      Historical data and audit trail for rule executions, violations, and automated actions.
      Provides visibility into rule performance and compliance monitoring.
  - name: Static Content
    description: |
      Static content management including files, documents, and resources associated with devices or the platform.
      Handles content storage, retrieval, and organization.
  - name: Statuses History
    description: |
      Historical device status information including connectivity states, operational status, and status change events.
      Tracks device availability and operational history over time.
  - name: Support
    description: |
      Support and help system including documentation, assistance tools, and support resources.
      Provides access to platform support features and help content.
  - name: SystemPreferences
    description: |
      System-wide configuration and preference management including platform settings and administrative controls.
      Manages global system parameters and operational preferences.
  - name: UI
    description: |
      User interface components and frontend-specific operations including UI configuration and presentation logic.
      Handles interface customization and user experience features.
  - name: User Forgot Password Flow
    description: |
      Password recovery and reset functionality including forgot password workflows and security validation.
      Manages secure password reset processes and account recovery.
  - name: User Registration Flow
    description: |
      User registration and account creation processes including signup workflows and account activation.
      Handles new user onboarding and account setup procedures.
paths:
  /devices/query:
    post:
      operationId: post_devices_query
      summary: Search and filter devices (includes total device count)
      tags:
        - Devices
      description: |
        Retrieve a filtered list of IoT devices based on various criteria. This endpoint supports complex filtering, sorting, and pagination to help you find specific devices in your IoT deployment.
        
        **Device Count Information:** The response includes pagination data with `totalCount` showing the total number of devices matching your criteria. To get just the device count, use `{"limit": 1, "offset": 0}` - the response will include the total count in the pagination section.
        
        **Use Cases:**
        - **Get total device count**: Use with minimal payload to retrieve device count
        - Find devices by type, name, or ID
        - Filter devices by connection status (online/offline)
        - Search for devices with active alerts
        - Filter devices by managed group membership
        - Get devices by gateway association
        - Paginate through large device lists
        
        **Access Control:** Returns only devices the authenticated user has permission to view based on their managed group assignments.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceQueryListBody"
      responses:
        "200":
          description: Successfully retrieved filtered device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetDevicesResponse"
        "400":
          description: Invalid query parameters or malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred while processing the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
  /devices/query/counts:
    post:
      operationId: post_devices_query_counts
      summary: "⚠️ DEPRECATED: Get device counts (use /devices/query instead)"
      tags:
        - Devices
      description: |
        **⚠️ WARNING: This endpoint currently has server-side issues and may return errors.**
        
        **RECOMMENDED ALTERNATIVE:** Use `/devices/query` with `{"limit": 1, "offset": 0}` to get device counts. The response includes `totalCount` in the pagination section which provides the same information reliably.
        
        ~~Get the count of devices that match specific filter criteria without retrieving the full device details. This is useful for pagination, dashboard metrics, and quick statistics.~~
        
        **Use Cases (use /devices/query instead):**
        - ~~Calculate total devices before paginating results~~
        - ~~Display device count statistics on dashboards~~
        - ~~Validate filter criteria effectiveness~~
        - ~~Get counts for multiple filter combinations simultaneously~~
        
        **Performance Note:** This endpoint is optimized for counting and is much faster than querying full device details when you only need quantities.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceQueryCountBody"
      responses:
        "200":
          description: Successfully retrieved device counts for the specified filter criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/device_count_response"
        "400":
          description: Invalid filter criteria or malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: Internal server error occurred while calculating counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
