  /history/events/{analysis}:
    post:
      operationId: post_history_events_analysis
      tags:
        - Events History
      summary: Get device events history for group (find devices with most events)
      description: |
        Retrieve historical event data for all devices within a specified managed group. This endpoint is essential for analyzing device activity patterns and identifying which devices generate the most events.
        
        **Key Use Cases:**
        - **Find most active devices**: Analyze event counts per device to identify highest activity devices
        - **Event pattern analysis**: Review events over time periods (hourly, daily, weekly)
        - **Device troubleshooting**: Investigate devices with unusual event patterns
        - **System monitoring**: Track event volume trends across device groups
        
        **Parameters:**
        - `analysis`: Use "raw" for detailed event data, "aggregation" for summarized counts
        
        **Request Body Example for Last Week:**
        ```json
        {
          "from": "2025-08-05T00:00:00Z",
          "to": "2025-08-11T23:59:59Z"
        }
        ```
        
        **Response:** Returns detailed event history with device IDs, timestamps, and event details for analysis.
      parameters:
        - $ref: "#/components/parameters/analysis"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/deviceEventsHistory"
        required: true
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetEventsHistoryResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
