  /users:
    get:
      operationId: get_users
      summary: Retrieve system users and administrators
      tags:
        - Users
      description: |
        Retrieve a list of system users including administrators and superadministrators. This endpoint provides comprehensive user management capabilities for system administration.
        
        **Access Control:** 
        Users with appropriate permissions can view different scopes of user information based on their assigned roles.
        
        **Role-Based Permissions:**
        - **Roles** are collections of permissions that determine what actions users can perform
        - **Permissions** control access to specific resources, operations, and data scopes
        - **Managed Groups** define the organizational boundaries for user access and permissions
        - Users may have different roles with varying permission sets depending on deployment configuration
        
        **Search and Filtering:**
        - **Text Search**: Filter users by name, email, or identifier
        - **Group Filtering**: Show users assigned to specific managed groups
        - **Pagination**: Handle large user lists with offset/limit controls
        
        **Use Cases:**
        - User administration and role management
        - Audit user access and permissions
        - Bulk user operations and reporting
      parameters:
        - name: offset
          in: query
          description: in multi-result responses, specifies which result to send from
          required: false
          style: form
          explode: true
          schema:
            type: number
        - name: limit
          in: query
          description: in multi-result responses, specifies how many results to send
          required: false
          style: form
          explode: true
          schema:
            type: number
        - name: search
          in: query
          description: filter by value
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: group
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: groupIdFilterType
          in: query
          required: false
          style: form
          explode: true
          schema:
            $ref: "#/components/schemas/GroupFilterOperation"
        - name: fields
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                - firstName
                - lastName
                - email
                - mobilePhone
                - roleId
                - managedGroups
        - name: roleId
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
        - name: orderBy
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            enum:
              - firstName
              - lastName
              - email
              - country
              - timeZone
              - mobilePhone
              - additionalPhone
        - name: orderByDirection
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: string
            enum:
              - ascending
              - descending
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetUsersResponse"
        "400":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
        "500":
          description: a list of errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericFailureResponse"
    post:
      operationId: post_users
      tags:
        - Users
      description: Add user. (authorized for users with the relevant permission only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRegistrationInfo"
        required: true
      responses:
        "200":
          description: response
          content:
